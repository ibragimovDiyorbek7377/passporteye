<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customs Committee Passport Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --customs-green: #089000;
            --ultra-dark: #050505;
            --mask-dark: rgba(0, 0, 0, 0.85);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--ultra-dark);
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.3px;
        }

        /* Header Strip */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            text-align: center;
            z-index: 100;
            border-bottom: 1px solid var(--customs-green);
        }

        .header h1 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Full-screen camera layer */
        .camera-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The Sniper Scope - Mask Overlay with Cutout */
        .mask-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        /* Dark mask with transparent hole */
        .mask-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--mask-dark);
            /* Create cutout hole using box-shadow */
            box-shadow: 0 0 0 100vh var(--mask-dark);
        }

        /* The MRZ Cutout Box */
        .mrz-cutout {
            position: absolute;
            bottom: 20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 15vh;
            border: 2px solid var(--customs-green);
            border-radius: 4px;
            box-shadow:
                0 0 20px var(--customs-green),
                inset 0 0 20px rgba(8, 144, 0, 0.2);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow:
                    0 0 20px var(--customs-green),
                    inset 0 0 20px rgba(8, 144, 0, 0.2);
            }
            50% {
                box-shadow:
                    0 0 30px var(--customs-green),
                    inset 0 0 30px rgba(8, 144, 0, 0.3);
            }
        }

        /* Corner markers */
        .mrz-cutout::before,
        .mrz-cutout::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--customs-green);
        }

        .mrz-cutout::before {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .mrz-cutout::after {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl,
        .corner-br {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--customs-green);
        }

        .corner-bl {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }

        /* Label above cutout */
        .cutout-label {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* Controls at bottom */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: linear-gradient(to top, rgba(5, 5, 5, 0.95) 0%, transparent 100%);
        }

        /* Shutter button */
        .shutter-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--ultra-dark);
            border: 4px solid var(--customs-green);
            box-shadow:
                0 0 30px rgba(8, 144, 0, 0.5),
                inset 0 0 20px rgba(8, 144, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .shutter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--customs-green);
            transition: all 0.2s ease;
        }

        .shutter-btn:active {
            transform: scale(0.95);
            box-shadow:
                0 0 40px rgba(8, 144, 0, 0.8),
                inset 0 0 30px rgba(8, 144, 0, 0.4);
        }

        .shutter-btn:active::before {
            width: 50px;
            height: 50px;
        }

        .shutter-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            color: #6b7280;
            font-size: 11px;
            z-index: 40;
            font-weight: 500;
        }

        /* Results modal */
        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            z-index: 200;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        .results-modal.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-content {
            padding: 80px 20px 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--customs-green);
        }

        .result-header h2 {
            font-size: 20px;
            color: var(--customs-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .validation-badge {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .validation-badge.pass {
            background: rgba(8, 144, 0, 0.2);
            color: var(--customs-green);
            border: 1px solid var(--customs-green);
        }

        .validation-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .data-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .data-item {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 6px;
            border-left: 3px solid var(--customs-green);
        }

        .data-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .data-value {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .data-value.highlight {
            color: var(--customs-green);
            font-size: 18px;
        }

        .btn-rescan {
            width: 100%;
            padding: 18px;
            background: var(--customs-green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(8, 144, 0, 0.4);
        }

        .btn-rescan:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(8, 144, 0, 0.6);
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 150;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(8, 144, 0, 0.2);
            border-top: 4px solid var(--customs-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Error toast */
        .error-toast {
            display: none;
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: #fff;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            z-index: 250;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
            animation: slideDown 0.3s ease-out;
        }

        .error-toast.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Scanning animation */
        .scanning .mrz-cutout {
            animation: scan-pulse 1s ease-in-out infinite;
        }

        @keyframes scan-pulse {
            0%, 100% {
                border-color: var(--customs-green);
                box-shadow:
                    0 0 20px var(--customs-green),
                    inset 0 0 20px rgba(8, 144, 0, 0.2);
            }
            50% {
                border-color: #0aff00;
                box-shadow:
                    0 0 40px #0aff00,
                    inset 0 0 40px rgba(10, 255, 0, 0.4);
            }
        }

        .scan-line {
            display: none;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--customs-green);
            box-shadow: 0 0 10px var(--customs-green);
            animation: scan-move 1.5s ease-in-out infinite;
        }

        .scanning .scan-line {
            display: block;
        }

        @keyframes scan-move {
            0%, 100% {
                top: 0;
                opacity: 0;
            }
            50% {
                top: 100%;
                opacity: 1;
            }
        }

        /* Hide elements */
        .hidden {
            display: none !important;
        }

        /* Canvas for cropping (hidden) */
        #crop-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>CUSTOMS COMMITTEE OF UZBEKISTAN</h1>
    </div>

    <!-- Camera Layer -->
    <div class="camera-layer">
        <video id="video-feed" autoplay playsinline></video>
    </div>

    <!-- Mask Overlay with MRZ Cutout -->
    <div class="mask-overlay">
        <div class="mrz-cutout" id="mrz-cutout">
            <div class="corner-bl"></div>
            <div class="corner-br"></div>
            <div class="scan-line"></div>
            <div class="cutout-label">MRZ kodni ramka ichiga joylashtiring</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="shutter-btn" id="shutter-btn"></button>
    </div>

    <!-- Footer -->
    <div class="footer">
        Targeting and risk department
    </div>

    <!-- Hidden canvas for cropping -->
    <canvas id="crop-canvas"></canvas>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="error-toast"></div>

    <!-- Results Modal -->
    <div class="results-modal" id="results-modal">
        <div class="results-content">
            <div class="result-header">
                <h2>Scan Results</h2>
                <span class="validation-badge" id="validation-badge">PASS</span>
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Results will be inserted here -->
            </div>

            <button class="btn-rescan" id="btn-rescan">Scan Another</button>
        </div>
    </div>

    <script>
        // Telegram WebApp initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // DOM elements
        const videoFeed = document.getElementById('video-feed');
        const shutterBtn = document.getElementById('shutter-btn');
        const mrzCutout = document.getElementById('mrz-cutout');
        const loading = document.getElementById('loading');
        const errorToast = document.getElementById('error-toast');
        const resultsModal = document.getElementById('results-modal');
        const btnRescan = document.getElementById('btn-rescan');
        const cropCanvas = document.getElementById('crop-canvas');

        let stream = null;
        let isScanning = false;

        // Initialize camera
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoFeed.srcObject = stream;

                console.log('Camera initialized');
            } catch (error) {
                console.error('Camera error:', error);
                showError('Camera access denied. Please enable camera permissions.');
                shutterBtn.disabled = true;
            }
        }

        // Capture and crop MRZ area
        function captureAndCropMRZ() {
            if (isScanning) return;
            isScanning = true;

            // Haptic feedback
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            // Start scanning animation
            mrzCutout.parentElement.classList.add('scanning');

            // Create temporary canvas with full video frame
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = videoFeed.videoWidth;
            tempCanvas.height = videoFeed.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(videoFeed, 0, 0);

            // Calculate MRZ cutout coordinates in video space
            const cutoutRect = calculateCutoutRect();

            // Crop to MRZ area only
            cropCanvas.width = cutoutRect.width;
            cropCanvas.height = cutoutRect.height;
            const cropCtx = cropCanvas.getContext('2d');

            cropCtx.drawImage(
                tempCanvas,
                cutoutRect.x, cutoutRect.y, cutoutRect.width, cutoutRect.height,
                0, 0, cutoutRect.width, cutoutRect.height
            );

            // Convert cropped canvas to blob
            cropCanvas.toBlob(async (blob) => {
                await sendToBackend(blob);
            }, 'image/jpeg', 0.95);
        }

        // Calculate MRZ cutout rectangle in video coordinates
        function calculateCutoutRect() {
            const videoWidth = videoFeed.videoWidth;
            const videoHeight = videoFeed.videoHeight;

            // MRZ cutout dimensions (matching CSS)
            const cutoutWidthPercent = 0.90;
            const cutoutHeightPercent = 0.15;
            const cutoutBottomPercent = 0.20;

            const width = Math.floor(videoWidth * cutoutWidthPercent);
            const height = Math.floor(videoHeight * cutoutHeightPercent);
            const x = Math.floor((videoWidth - width) / 2);
            const y = Math.floor(videoHeight * (1 - cutoutBottomPercent - cutoutHeightPercent));

            return { x, y, width, height };
        }

        // Send cropped image to backend
        async function sendToBackend(blob) {
            loading.classList.add('show');

            const formData = new FormData();
            formData.append('file', blob, 'mrz.jpg');

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Scan failed');
                }

                displayResults(result.data);

            } catch (error) {
                console.error('Scan error:', error);
                showError(error.message || 'Failed to scan passport');
                isScanning = false;
                mrzCutout.parentElement.classList.remove('scanning');
            } finally {
                loading.classList.remove('show');
            }
        }

        // Display results
        function displayResults(data) {
            // Validation badge
            const badge = document.getElementById('validation-badge');
            const status = data.validation_status || 'FAIL';
            badge.textContent = status;
            badge.className = `validation-badge ${status.toLowerCase()}`;

            // Data grid
            const dataGrid = document.getElementById('data-grid');
            dataGrid.innerHTML = `
                <div class="data-item">
                    <div class="data-label">Passport Number</div>
                    <div class="data-value highlight">${data.passport_number || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Surname</div>
                    <div class="data-value">${data.surname || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Given Names</div>
                    <div class="data-value">${data.name || data.given_names || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">PINFL</div>
                    <div class="data-value highlight">${data.pinfl || data.personal_number || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Date of Birth</div>
                    <div class="data-value">${data.birth_date || data.date_of_birth || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Sex</div>
                    <div class="data-value">${data.sex || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Expiry Date</div>
                    <div class="data-value">${data.expiry_date || data.date_of_expiry || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Nationality</div>
                    <div class="data-value">${data.nationality || 'N/A'}</div>
                </div>
            `;

            // Show results modal
            resultsModal.classList.add('show');
            mrzCutout.parentElement.classList.remove('scanning');
            isScanning = false;

            // Send data to Telegram
            if (tg?.sendData) {
                tg.sendData(JSON.stringify(data));
            }
        }

        // Show error
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => {
                errorToast.classList.remove('show');
            }, 4000);
        }

        // Rescan
        function rescan() {
            resultsModal.classList.remove('show');
            isScanning = false;
            mrzCutout.parentElement.classList.remove('scanning');
        }

        // Event listeners
        shutterBtn.addEventListener('click', captureAndCropMRZ);
        btnRescan.addEventListener('click', rescan);

        // Initialize
        window.addEventListener('load', initCamera);

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
