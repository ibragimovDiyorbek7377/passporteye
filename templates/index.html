<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customs Committee Passport Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --customs-green: #089000;
            --ultra-dark: #050505;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--ultra-dark);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.3px;
        }

        /* Header Strip */
        .header {
            padding: 20px 16px;
            text-align: center;
            background: var(--ultra-dark);
            border-bottom: 1px solid var(--customs-green);
        }

        .header h1 {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        /* Main Content Area - Solid Black Background */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--ultra-dark);
            padding: 20px;
            gap: 12px;
        }

        /* Label above scanner */
        .scanner-label {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* THE SCANNER STRIP - The ONLY place where camera is visible */
        .scanner-strip {
            width: 90%;
            max-width: 600px;
            height: 140px;
            position: relative;
            overflow: hidden; /* CRITICAL: This hides everything outside */
            border: 3px solid var(--customs-green);
            border-radius: 12px;
            box-shadow:
                0 0 30px rgba(8, 144, 0, 0.4),
                inset 0 0 30px rgba(8, 144, 0, 0.1);
            animation: pulse-glow 2s ease-in-out infinite;
            background: #000; /* Fallback before camera loads */
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow:
                    0 0 30px rgba(8, 144, 0, 0.4),
                    inset 0 0 30px rgba(8, 144, 0, 0.1);
            }
            50% {
                box-shadow:
                    0 0 40px rgba(8, 144, 0, 0.6),
                    inset 0 0 40px rgba(8, 144, 0, 0.2);
            }
        }

        /* Video element - INSIDE the scanner strip */
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Zoom to fill the strip */
            display: block;
        }

        /* Corner markers for scanner strip */
        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 3px solid var(--customs-green);
        }

        .corner.tl {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .corner.tr {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bl {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
        }

        .corner.br {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }

        /* Scanning animation line */
        .scan-line {
            display: none;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--customs-green);
            box-shadow: 0 0 15px var(--customs-green);
            animation: scan-move 1.5s ease-in-out infinite;
            z-index: 10;
        }

        .scanner-strip.scanning .scan-line {
            display: block;
        }

        @keyframes scan-move {
            0%, 100% {
                top: 0;
                opacity: 0;
            }
            50% {
                top: 100%;
                opacity: 1;
            }
        }

        /* Intense scanning pulse */
        .scanner-strip.scanning {
            animation: scan-pulse 1s ease-in-out infinite;
        }

        @keyframes scan-pulse {
            0%, 100% {
                border-color: var(--customs-green);
                box-shadow:
                    0 0 30px rgba(8, 144, 0, 0.4),
                    inset 0 0 30px rgba(8, 144, 0, 0.1);
            }
            50% {
                border-color: #0aff00;
                box-shadow:
                    0 0 50px rgba(10, 255, 0, 0.8),
                    inset 0 0 50px rgba(10, 255, 0, 0.3);
            }
        }

        /* Controls at bottom */
        .controls {
            padding: 30px 20px;
            background: var(--ultra-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Shutter button */
        .shutter-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--ultra-dark);
            border: 4px solid var(--customs-green);
            box-shadow:
                0 0 30px rgba(8, 144, 0, 0.5),
                inset 0 0 20px rgba(8, 144, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .shutter-btn::before {
            content: 'SCAN';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
            color: var(--customs-green);
            letter-spacing: 1px;
        }

        .shutter-btn:active {
            transform: scale(0.95);
            box-shadow:
                0 0 40px rgba(8, 144, 0, 0.8),
                inset 0 0 30px rgba(8, 144, 0, 0.4);
        }

        .shutter-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #6b7280;
            font-size: 10px;
            padding-bottom: 12px;
            font-weight: 500;
        }

        /* Results modal */
        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            z-index: 200;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        .results-modal.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-content {
            padding: 80px 20px 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--customs-green);
        }

        .result-header h2 {
            font-size: 20px;
            color: var(--customs-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .validation-badge {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .validation-badge.pass {
            background: rgba(8, 144, 0, 0.2);
            color: var(--customs-green);
            border: 1px solid var(--customs-green);
        }

        .validation-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .data-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .data-item {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 6px;
            border-left: 3px solid var(--customs-green);
        }

        .data-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .data-value {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .data-value.highlight {
            color: var(--customs-green);
            font-size: 18px;
        }

        .btn-rescan {
            width: 100%;
            padding: 18px;
            background: var(--customs-green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(8, 144, 0, 0.4);
        }

        .btn-rescan:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(8, 144, 0, 0.6);
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 150;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(8, 144, 0, 0.2);
            border-top: 4px solid var(--customs-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Error toast */
        .error-toast {
            display: none;
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: #fff;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            z-index: 250;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
            animation: slideDown 0.3s ease-out;
        }

        .error-toast.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Canvas for cropping (hidden) */
        #crop-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>CUSTOMS COMMITTEE OF UZBEKISTAN</h1>
    </div>

    <!-- Main Content - Solid Black Background -->
    <div class="main-content">
        <!-- Label -->
        <div class="scanner-label">MRZ kodni shu yerga to'g'rilang</div>

        <!-- THE SCANNER STRIP - Camera is ONLY visible here -->
        <div class="scanner-strip" id="scanner-strip">
            <video id="video-feed" autoplay playsinline></video>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scan-line"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="shutter-btn" id="shutter-btn"></button>
    </div>

    <!-- Footer -->
    <div class="footer">
        Targeting and risk department
    </div>

    <!-- Hidden canvas for cropping -->
    <canvas id="crop-canvas"></canvas>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="error-toast"></div>

    <!-- Results Modal -->
    <div class="results-modal" id="results-modal">
        <div class="results-content">
            <div class="result-header">
                <h2>Scan Results</h2>
                <span class="validation-badge" id="validation-badge">PASS</span>
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Results will be inserted here -->
            </div>

            <button class="btn-rescan" id="btn-rescan">Scan Another</button>
        </div>
    </div>

    <script>
        // Telegram WebApp initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // DOM elements
        const videoFeed = document.getElementById('video-feed');
        const shutterBtn = document.getElementById('shutter-btn');
        const scannerStrip = document.getElementById('scanner-strip');
        const loading = document.getElementById('loading');
        const errorToast = document.getElementById('error-toast');
        const resultsModal = document.getElementById('results-modal');
        const btnRescan = document.getElementById('btn-rescan');
        const cropCanvas = document.getElementById('crop-canvas');

        let stream = null;
        let isScanning = false;

        // Initialize camera
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoFeed.srcObject = stream;

                console.log('Camera initialized');
            } catch (error) {
                console.error('Camera error:', error);
                showError('Camera access denied. Please enable camera permissions.');
                shutterBtn.disabled = true;
            }
        }

        // Capture - WYSIWYG: What You See Is What You Get
        function captureAndCropMRZ() {
            if (isScanning) return;
            isScanning = true;

            // Haptic feedback
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            // Start scanning animation
            scannerStrip.classList.add('scanning');

            // Get the scanner strip dimensions
            const stripRect = scannerStrip.getBoundingClientRect();
            const stripWidth = stripRect.width;
            const stripHeight = stripRect.height;

            // Get video dimensions
            const videoWidth = videoFeed.videoWidth;
            const videoHeight = videoFeed.videoHeight;

            // Calculate the crop area to match what's visible in the scanner strip
            // Since object-fit: cover is used, we need to calculate the visible portion
            const videoAspect = videoWidth / videoHeight;
            const stripAspect = stripWidth / stripHeight;

            let sourceX, sourceY, sourceWidth, sourceHeight;

            if (videoAspect > stripAspect) {
                // Video is wider - crop sides
                sourceHeight = videoHeight;
                sourceWidth = videoHeight * stripAspect;
                sourceX = (videoWidth - sourceWidth) / 2;
                sourceY = 0;
            } else {
                // Video is taller - crop top/bottom
                sourceWidth = videoWidth;
                sourceHeight = videoWidth / stripAspect;
                sourceX = 0;
                sourceY = (videoHeight - sourceHeight) / 2;
            }

            // Set canvas to match the scanner strip aspect ratio
            // Use high resolution for better OCR
            const targetWidth = 1200; // Good resolution for OCR
            const targetHeight = Math.round(targetWidth / stripAspect);

            cropCanvas.width = targetWidth;
            cropCanvas.height = targetHeight;
            const ctx = cropCanvas.getContext('2d');

            // Draw the visible portion
            ctx.drawImage(
                videoFeed,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, targetWidth, targetHeight
            );

            // Convert to blob and send
            cropCanvas.toBlob(async (blob) => {
                await sendToBackend(blob);
            }, 'image/jpeg', 0.95);
        }

        // Send cropped image to backend
        async function sendToBackend(blob) {
            loading.classList.add('show');

            const formData = new FormData();
            formData.append('file', blob, 'mrz.jpg');

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Scan failed');
                }

                displayResults(result.data);

            } catch (error) {
                console.error('Scan error:', error);
                showError(error.message || 'Failed to scan passport');
                isScanning = false;
                scannerStrip.classList.remove('scanning');
            } finally {
                loading.classList.remove('show');
            }
        }

        // Display results
        function displayResults(data) {
            // Validation badge
            const badge = document.getElementById('validation-badge');
            const status = data.validation_status || 'FAIL';
            badge.textContent = status;
            badge.className = `validation-badge ${status.toLowerCase()}`;

            // Data grid
            const dataGrid = document.getElementById('data-grid');
            dataGrid.innerHTML = `
                <div class="data-item">
                    <div class="data-label">Passport Number</div>
                    <div class="data-value highlight">${data.passport_number || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Surname</div>
                    <div class="data-value">${data.surname || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Given Names</div>
                    <div class="data-value">${data.name || data.given_names || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">PINFL</div>
                    <div class="data-value highlight">${data.pinfl || data.personal_number || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Date of Birth</div>
                    <div class="data-value">${data.birth_date || data.date_of_birth || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Sex</div>
                    <div class="data-value">${data.sex || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Expiry Date</div>
                    <div class="data-value">${data.expiry_date || data.date_of_expiry || 'N/A'}</div>
                </div>
                <div class="data-item">
                    <div class="data-label">Nationality</div>
                    <div class="data-value">${data.nationality || 'N/A'}</div>
                </div>
            `;

            // Show results modal
            resultsModal.classList.add('show');
            scannerStrip.classList.remove('scanning');
            isScanning = false;

            // Send data to Telegram
            if (tg?.sendData) {
                tg.sendData(JSON.stringify(data));
            }
        }

        // Show error
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => {
                errorToast.classList.remove('show');
            }, 4000);
        }

        // Rescan
        function rescan() {
            resultsModal.classList.remove('show');
            isScanning = false;
            scannerStrip.classList.remove('scanning');
        }

        // Event listeners
        shutterBtn.addEventListener('click', captureAndCropMRZ);
        btnRescan.addEventListener('click', rescan);

        // Initialize
        window.addEventListener('load', initCamera);

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
