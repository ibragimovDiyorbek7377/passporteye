<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customs Committee Passport Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --customs-green: #089000;
            --ultra-dark: #050505;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: #000;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.3px;
        }

        /* ===== LAYER 1: FULL-SCREEN CAMERA (Background) ===== */
        #video-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* ===== LAYER 2: DARK OVERLAY MASK WITH TRANSPARENT CUTOUT ===== */
        .overlay-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scanner-cutout {
            width: 85%;
            max-width: 500px;
            height: 160px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            /* THE MAGIC: Massive box-shadow creates the dark overlay around the cutout */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Corner markers for the cutout */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid var(--customs-green);
        }

        .corner.tl {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
        }

        .corner.tr {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bl {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
        }

        .corner.br {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
        }

        /* Scanning animation line */
        .scan-line {
            display: none;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--customs-green);
            box-shadow: 0 0 20px var(--customs-green);
            animation: scan-move 1.5s ease-in-out infinite;
            z-index: 1;
        }

        .scanner-cutout.scanning .scan-line {
            display: block;
        }

        @keyframes scan-move {
            0%, 100% {
                top: 0;
                opacity: 0;
            }
            50% {
                top: 100%;
                opacity: 1;
            }
        }

        /* Scanning pulse effect on border */
        .scanner-cutout.scanning {
            border-color: var(--customs-green);
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(8, 144, 0, 0.6),
                inset 0 0 40px rgba(8, 144, 0, 0.3);
            animation: scan-pulse 1s ease-in-out infinite;
        }

        @keyframes scan-pulse {
            0%, 100% {
                border-color: var(--customs-green);
            }
            50% {
                border-color: #0aff00;
            }
        }

        /* Label above scanner */
        .scanner-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
        }

        /* ===== LAYER 3: UI ELEMENTS (Top & Bottom) ===== */
        /* iOS-style Header Bar */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--customs-green);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            pointer-events: auto;
        }

        .header-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 17px;
            font-weight: 400;
            cursor: pointer;
            padding: 8px 12px;
            transition: opacity 0.2s ease;
        }

        .header-btn:active {
            opacity: 0.6;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .flash-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            transition: opacity 0.2s ease;
        }

        .flash-btn:active {
            opacity: 0.6;
        }

        /* Bottom Controls */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 40px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            pointer-events: auto;
        }

        /* Shutter button */
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid var(--customs-green);
            box-shadow: 0 4px 20px rgba(8, 144, 0, 0.6);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .shutter-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--customs-green);
        }

        .shutter-btn:active {
            transform: scale(0.95);
        }

        .shutter-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Footer text */
        .footer-text {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* ===== CHECKMARK SUCCESS ANIMATION ===== */
        .checkmark-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .checkmark-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .checkmark-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--customs-green);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(8, 144, 0, 0.8);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark-icon {
            width: 60px;
            height: 60px;
            stroke: #ffffff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.6s ease-out 0.3s forwards;
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Results modal */
        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            z-index: 200;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        .results-modal.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-content {
            padding: 80px 20px 100px;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--customs-green);
        }

        .result-header h2 {
            font-size: 20px;
            color: var(--customs-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .validation-badge {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .validation-badge.pass {
            background: rgba(8, 144, 0, 0.2);
            color: var(--customs-green);
            border: 1px solid var(--customs-green);
        }

        .validation-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .data-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .data-item {
            background: #0a0a0a;
            padding: 16px;
            border-radius: 6px;
            border-left: 3px solid var(--customs-green);
        }

        .data-label {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .data-value {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }

        .data-value.highlight {
            color: var(--customs-green);
            font-size: 18px;
        }

        .btn-rescan {
            width: 100%;
            padding: 18px;
            background: var(--customs-green);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(8, 144, 0, 0.4);
        }

        .btn-rescan:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(8, 144, 0, 0.6);
        }

        /* Loading overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 5, 0.95);
            z-index: 150;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(8, 144, 0, 0.2);
            border-top: 4px solid var(--customs-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Error toast */
        .error-toast {
            display: none;
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: #fff;
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            z-index: 250;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
            animation: slideDown 0.3s ease-out;
        }

        .error-toast.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        /* Canvas for cropping (hidden) */
        #crop-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <!-- ===== LAYER 1: FULL-SCREEN CAMERA (z-index: 0) ===== -->
    <video id="video-feed" autoplay playsinline></video>

    <!-- ===== LAYER 2: DARK OVERLAY MASK (z-index: 10) ===== -->
    <div class="overlay-mask">
        <div class="scanner-cutout" id="scanner-cutout">
            <div class="scanner-label">Position MRZ code within this frame</div>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scan-line"></div>
        </div>
    </div>

    <!-- ===== LAYER 3: UI ELEMENTS (z-index: 20+) ===== -->
    <!-- iOS-style Header -->
    <div class="header">
        <button class="header-btn" id="cancel-btn">Cancel</button>
        <div class="header-title">MRZ Scanner</div>
        <button class="flash-btn" id="flash-btn">⚡</button>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
        <button class="shutter-btn" id="shutter-btn"></button>
        <div class="footer-text">Customs Committee of Uzbekistan</div>
    </div>

    <!-- Checkmark Success Overlay -->
    <div class="checkmark-overlay" id="checkmark-overlay">
        <div class="checkmark-circle">
            <svg class="checkmark-icon" viewBox="0 0 52 52">
                <polyline points="14,26 22,34 38,18" />
            </svg>
        </div>
    </div>

    <!-- Hidden canvas for cropping -->
    <canvas id="crop-canvas"></canvas>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Processing...</div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="error-toast"></div>

    <!-- Results Modal -->
    <div class="results-modal" id="results-modal">
        <div class="results-content">
            <div class="result-header">
                <h2>Scan Results</h2>
                <span class="validation-badge" id="validation-badge">PASS</span>
            </div>

            <div class="data-grid" id="data-grid">
                <!-- Results will be inserted here -->
            </div>

            <button class="btn-rescan" id="btn-rescan">Scan Another</button>
        </div>
    </div>

    <script>
        // Telegram WebApp initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // DOM elements
        const videoFeed = document.getElementById('video-feed');
        const shutterBtn = document.getElementById('shutter-btn');
        const scannerCutout = document.getElementById('scanner-cutout');
        const cancelBtn = document.getElementById('cancel-btn');
        const flashBtn = document.getElementById('flash-btn');
        const checkmarkOverlay = document.getElementById('checkmark-overlay');
        const loading = document.getElementById('loading');
        const errorToast = document.getElementById('error-toast');
        const resultsModal = document.getElementById('results-modal');
        const btnRescan = document.getElementById('btn-rescan');
        const cropCanvas = document.getElementById('crop-canvas');

        let stream = null;
        let isScanning = false;
        let flashEnabled = false;

        // Initialize camera
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoFeed.srcObject = stream;

                console.log('Camera initialized');
            } catch (error) {
                console.error('Camera error:', error);
                showError('Camera access denied. Please enable camera permissions.');
                shutterBtn.disabled = true;
            }
        }

        // Toggle flash
        function toggleFlash() {
            if (!stream) return;

            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            if (capabilities.torch) {
                flashEnabled = !flashEnabled;
                track.applyConstraints({
                    advanced: [{ torch: flashEnabled }]
                }).then(() => {
                    flashBtn.style.opacity = flashEnabled ? '1' : '0.6';
                }).catch(err => {
                    console.error('Flash toggle failed:', err);
                });
            }
        }

        // Capture - WYSIWYG: Crop the area visible in the scanner cutout
        function captureAndCropMRZ() {
            if (isScanning) return;
            isScanning = true;

            // Haptic feedback
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            // Start scanning animation
            scannerCutout.classList.add('scanning');

            // Get the scanner cutout dimensions and position
            const cutoutRect = scannerCutout.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // Get actual video dimensions
            const videoWidth = videoFeed.videoWidth;
            const videoHeight = videoFeed.videoHeight;

            // Calculate how the video is rendered with object-fit: cover
            // The video is scaled to cover the viewport while maintaining aspect ratio
            const videoAspect = videoWidth / videoHeight;
            const viewportAspect = viewportWidth / viewportHeight;

            let renderedVideoWidth, renderedVideoHeight, offsetX, offsetY;

            if (videoAspect > viewportAspect) {
                // Video is wider - it will be scaled to match viewport height
                // and the sides will be cropped
                renderedVideoHeight = viewportHeight;
                renderedVideoWidth = videoHeight * viewportAspect;
                offsetX = (videoWidth - renderedVideoWidth) / 2;
                offsetY = 0;
            } else {
                // Video is taller - it will be scaled to match viewport width
                // and the top/bottom will be cropped
                renderedVideoWidth = viewportWidth;
                renderedVideoHeight = videoWidth / viewportAspect;
                offsetX = 0;
                offsetY = (videoHeight - renderedVideoHeight) / 2;
            }

            // Calculate the cutout position relative to the rendered video portion
            const scale = videoWidth / renderedVideoWidth;
            const sourceX = offsetX + (cutoutRect.left * scale);
            const sourceY = offsetY + (cutoutRect.top * scale);
            const sourceWidth = cutoutRect.width * scale;
            const sourceHeight = cutoutRect.height * scale;

            // Set canvas to high resolution for better OCR
            const targetWidth = 1200;
            const targetHeight = Math.round(targetWidth * (cutoutRect.height / cutoutRect.width));

            cropCanvas.width = targetWidth;
            cropCanvas.height = targetHeight;
            const ctx = cropCanvas.getContext('2d');

            // Draw the cropped portion
            ctx.drawImage(
                videoFeed,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, targetWidth, targetHeight
            );

            // Convert to blob and send
            cropCanvas.toBlob(async (blob) => {
                await sendToBackend(blob);
            }, 'image/jpeg', 0.95);
        }

        // Send cropped image to backend
        async function sendToBackend(blob) {
            loading.classList.add('show');

            const formData = new FormData();
            formData.append('file', blob, 'mrz.jpg');

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Scan failed');
                }

                displayResults(result.data);

            } catch (error) {
                console.error('Scan error:', error);
                showError(error.message || 'Failed to scan passport');
                isScanning = false;
                scannerCutout.classList.remove('scanning');
            } finally {
                loading.classList.remove('show');
            }
        }

        // Display results
        function displayResults(data) {
            // Stop scanning animation
            scannerCutout.classList.remove('scanning');

            // Show checkmark animation
            checkmarkOverlay.classList.add('show');

            // Haptic feedback for success
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            // After checkmark animation, show results modal
            setTimeout(() => {
                checkmarkOverlay.classList.remove('show');

                // Validation badge
                const badge = document.getElementById('validation-badge');
                const status = data.validation_status || 'FAIL';
                badge.textContent = status;
                badge.className = `validation-badge ${status.toLowerCase()}`;

                // Data grid
                const dataGrid = document.getElementById('data-grid');
                dataGrid.innerHTML = `
                    <div class="data-item">
                        <div class="data-label">Passport Number</div>
                        <div class="data-value highlight">${data.passport_number || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Surname</div>
                        <div class="data-value">${data.surname || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Given Names</div>
                        <div class="data-value">${data.name || data.given_names || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">PINFL</div>
                        <div class="data-value highlight">${data.pinfl || data.personal_number || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Date of Birth</div>
                        <div class="data-value">${data.birth_date || data.date_of_birth || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Sex</div>
                        <div class="data-value">${data.sex || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Expiry Date</div>
                        <div class="data-value">${data.expiry_date || data.date_of_expiry || 'N/A'}</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Nationality</div>
                        <div class="data-value">${data.nationality || 'N/A'}</div>
                    </div>
                `;

                // Show results modal
                resultsModal.classList.add('show');
                isScanning = false;

                // Send data to Telegram
                if (tg?.sendData) {
                    tg.sendData(JSON.stringify(data));
                }
            }, 1500); // Show checkmark for 1.5 seconds
        }

        // Show error
        function showError(message) {
            errorToast.textContent = message;
            errorToast.classList.add('show');
            setTimeout(() => {
                errorToast.classList.remove('show');
            }, 4000);
        }

        // Rescan
        function rescan() {
            resultsModal.classList.remove('show');
            checkmarkOverlay.classList.remove('show');
            isScanning = false;
            scannerCutout.classList.remove('scanning');
        }

        // Cancel button - go back or close
        function handleCancel() {
            if (resultsModal.classList.contains('show')) {
                rescan();
            } else if (tg?.close) {
                tg.close();
            } else {
                window.history.back();
            }
        }

        // Event listeners
        shutterBtn.addEventListener('click', captureAndCropMRZ);
        btnRescan.addEventListener('click', rescan);
        cancelBtn.addEventListener('click', handleCancel);
        flashBtn.addEventListener('click', toggleFlash);

        // Initialize
        window.addEventListener('load', initCamera);

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
